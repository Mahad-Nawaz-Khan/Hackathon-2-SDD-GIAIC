# Secrets Template - Production
# IMPORTANT: Do NOT commit actual secrets to git.
# Use this template to create secrets manually on the cluster.
#
# kubectl apply -f secrets.yaml -n todo-app
# OR create via kubectl create secret:
#   kubectl create secret generic neon-credentials \
#     --from-literal=connection-string='postgresql://...' -n todo-app
---
apiVersion: v1
kind: Secret
metadata:
  name: neon-credentials
  namespace: todo-app
type: Opaque
stringData:
  connection-string: "REPLACE_WITH_NEON_CONNECTION_STRING"
---
apiVersion: v1
kind: Secret
metadata:
  name: clerk-secrets
  namespace: todo-app
type: Opaque
stringData:
  secret-key: "REPLACE_WITH_CLERK_SECRET_KEY"
  issuer: "REPLACE_WITH_CLERK_ISSUER_URL"
  jwks-url: "REPLACE_WITH_CLERK_JWKS_URL"
  publishable-key: "REPLACE_WITH_CLERK_PUBLISHABLE_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-api-keys
  namespace: todo-app
type: Opaque
stringData:
  gemini-key: "REPLACE_WITH_GEMINI_API_KEY"
  gemini-model: "gemini-2.5-flash-lite"
  z-ai-key: "REPLACE_WITH_Z_AI_API_KEY"
  z-ai-model: "glm-4.5-air"
