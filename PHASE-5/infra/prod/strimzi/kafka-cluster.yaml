# Strimzi Kafka Cluster - Production (Oracle OKE Free Tier)
# Optimized for minimal resources: 1 replica, ephemeral storage
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: todo-kafka
  namespace: kafka
spec:
  kafka:
    version: 3.6.0
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      inter.broker.protocol.version: "3.6"
      log.retention.hours: 24
      log.segment.bytes: 1073741824
      num.partitions: 3
    storage:
      type: ephemeral
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: "500m"
        memory: 1Gi
  zookeeper:
    replicas: 1
    storage:
      type: ephemeral
    resources:
      limits:
        cpu: "200m"
        memory: 512Mi
      requests:
        cpu: "100m"
        memory: 256Mi
  entityOperator:
    topicOperator: {}
    userOperator: {}
