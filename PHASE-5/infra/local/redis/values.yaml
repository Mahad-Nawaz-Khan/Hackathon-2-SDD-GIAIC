# Redis Helm values for local development
# Chart: bitnami/redis
# Purpose: Local state store for Dapr

architecture: standalone

auth:
  enabled: false

master:
  persistence:
    enabled: false
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

replica:
  replicaCount: 0
