# NGINX Ingress Controller - Helm values
# Chart: ingress-nginx/ingress-nginx
controller:
  replicaCount: 1

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  service:
    type: LoadBalancer
    annotations:
      oci.oraclecloud.com/load-balancer-type: "nlb"

  config:
    proxy-body-size: "10m"
    proxy-read-timeout: "60"
    proxy-send-timeout: "60"

  metrics:
    enabled: false

  admissionWebhooks:
    enabled: true
