apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-chatbot-backend
  labels:
    app: todo-chatbot
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-chatbot
      component: backend
  template:
    metadata:
      labels:
        app: todo-chatbot
        component: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: backend
          image: hackathon-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: CLERK_ISSUER
              value: "https://civil-corgi-51.clerk.accounts.dev"
            - name: CLERK_JWKS_URL
              value: "https://civil-corgi-51.clerk.accounts.dev/.well-known/jwks.json"
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-chatbot-secrets
                  key: clerk-secret-key
            - name: CORS_ORIGINS
              value: "*"  # Allow all origins for local development
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todo-chatbot-secrets
                  key: database-url
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-chatbot-secrets
                  key: gemini-api-key
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash-lite"
            - name: Z_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-chatbot-secrets
                  key: z-ai-api-key
            - name: Z_AI_MODEL
              value: "glm-4.5-air"
            - name: PORT
              value: "8000"
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: todo-chatbot-backend
  labels:
    app: todo-chatbot
    component: backend
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
      nodePort: 30800  # Fixed port for backend
  selector:
    app: todo-chatbot
    component: backend
