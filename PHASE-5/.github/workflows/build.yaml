# Build and push multi-arch Docker images to GHCR
name: Build Multi-Arch Images

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-bake.hcl'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'

env:
  REGISTRY: ghcr.io

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            workdir: ./backend
            lint-cmd: pip install ruff && ruff check .
            test-cmd: pip install -r requirements.txt && pytest tests/ -v --tb=short || true
          - service: frontend
            workdir: ./frontend
            lint-cmd: npm ci && npm run lint || true
            test-cmd: npm ci && npm test || true
    steps:
      - uses: actions/checkout@v4

      - name: Lint ${{ matrix.service }}
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.lint-cmd }}

      - name: Test ${{ matrix.service }}
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.test-cmd }}

  build:
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
