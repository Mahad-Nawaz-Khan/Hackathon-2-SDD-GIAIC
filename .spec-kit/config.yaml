version: "1.0.0"
project:
  name: "Evolution of Todo - Spec-Driven Development & Cloud Native AI"
  description: "A 5-phase evolution of a Todo application from in-memory console to cloud-native AI chatbot on Kubernetes with MCP and Dapr"
  organization: "Panaversity / GIAIC"
  phases:
    - id: "phase-1"
      name: "In-Memory Python Console App"
      path: "PHASE-1"
      stack:
        - "Python 3.10+"
        - "pytest"
      specs_path: "PHASE-1/specs"
    - id: "phase-2"
      name: "Full-Stack Web App"
      path: "PHASE-2"
      stack:
        - "Next.js (App Router)"
        - "FastAPI"
        - "SQLModel"
        - "PostgreSQL (Neon)"
        - "Clerk Auth"
      specs_path: "PHASE-2/specs"
    - id: "phase-3"
      name: "AI-Powered Todo Chatbot"
      path: "PHASE-3"
      stack:
        - "FastAPI"
        - "OpenAI Agents SDK"
        - "Official MCP SDK"
        - "Next.js ChatKit UI"
        - "PostgreSQL (Neon)"
      specs_path: "PHASE-3/specs"
    - id: "phase-4"
      name: "Local Kubernetes Deployment"
      path: "PHASE-4"
      stack:
        - "Docker"
        - "Kubernetes (Minikube)"
        - "Helm Charts"
        - "FastAPI Backend"
        - "Next.js Frontend"
      specs_path: "PHASE-4/specs"
    - id: "phase-5"
      name: "Advanced Cloud Deployment"
      path: "PHASE-5"
      stack:
        - "Dapr (Pub/Sub, State Store)"
        - "Kafka / Redpanda"
        - "Redis"
        - "Kubernetes (DOKS / AKS / GKE)"
        - "FastAPI Backend"
        - "Next.js Frontend"
      specs_path: "PHASE-5/specs"
spec_kit:
  lifecycle:
    - "specify"
    - "plan"
    - "tasks"
    - "implement"
  constitution_file: "speckit.constitution"
  agents_manifest: "AGENTS.md"
  claude_shim: "CLAUDE.md"
